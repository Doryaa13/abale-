  <script>
    const tl = gsap.timeline({ paused: true });
    const VIEW_H = 976;
    // Screen switch times and each screen's punch-in focus (fractions of the screenshot).
    const switches = [0, 2.2, 4.4, 6.6, 8.8, 9.9, 11.0];
    const focus = [[0.5, 0.33], [0.5, 0.36], [0.5, 0.38], [0.5, 0.36], [0.5, 0.2], [0.5, 0.36], [0.5, 0.5]];
    const zoomTo = [1.16, 1.1, 1.16, 1.12, 1.2, 1.14, 1.12];

    // Phone arrives from below, blurred, on a long tail.
    tl.fromTo("#ft-phone", { y: 320, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 0);
    tl.fromTo("#ft-glow", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.1);

    // Park every screen but the first below the viewport.
    tl.set(".ft-scr", { y: VIEW_H }, 0);
    tl.set("#ft-s0", { y: 0 }, 0);

    switches.forEach((t, i) => {
      const z = "#ft-z" + i;
      tl.set(z, { transformOrigin: `${focus[i][0] * 616}px ${focus[i][1] * 1333}px`, scale: 1 }, 0);
      if (i > 0) {
        // Vertical push: the old screen leaves up as the new one rises in.
        const isWhip = i === 6;
        tl.fromTo("#ft-s" + (i - 1), { y: 0, filter: "blur(0px)" }, { y: -VIEW_H, filter: "blur(8px)", duration: isWhip ? 0.3 : 0.5, ease: "power3.inOut" }, t - (isWhip ? 0.3 : 0.5));
        tl.fromTo("#ft-s" + i, { y: VIEW_H, filter: "blur(8px)" }, { y: 0, filter: "blur(0px)", duration: isWhip ? 0.3 : 0.5, ease: "power3.inOut" }, t - (isWhip ? 0.3 : 0.5));
      }
      // Punch-in on the part of the screen this beat is about, then hold still.
      const end = i < switches.length - 1 ? switches[i + 1] : 13.2;
      if (end - t > 1.4) {
        tl.fromTo(z, { scale: 1 }, { scale: zoomTo[i], duration: 0.7, ease: "power2.inOut" }, t + 0.45);
      }
    });

    // Headlines: blur in, hold, blur out.
    const heads = [[0, 2.2], [2.2, 4.4], [4.4, 6.6], [6.6, 8.8], [8.8, 11.0], [11.0, 13.2]];
    heads.forEach(([s, e], i) => {
      const h = "#ft-h" + i;
      tl.fromTo(h + " .ft-eb", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, s + 0.08);
      tl.fromTo(h + " .ft-main", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, s + 0.14);
      const outAt = i === heads.length - 1 ? 12.85 : e - 0.2;
      tl.fromTo(h, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, outAt);
    });

    // The phone exits accelerating, making room for the promise.
    tl.fromTo("#ft-phone", { scale: 1 }, { scale: 0.86, opacity: 0, filter: "blur(12px)", duration: 0.3, ease: "power3.in", immediateRender: false }, 12.88);

    window.__timelines["features"] = tl;
