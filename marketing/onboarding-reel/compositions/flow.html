  <script>
    const tl = gsap.timeline({ paused: true });
    const OFF = 1100;

    // Phones travel across the frame: each new screen slides in from the left
    // and the previous one leaves to the right (forward, in Hebrew).
    const enter = (p, t) => tl.fromTo(p,
      { x: -OFF, rotation: -5, opacity: 1, filter: "blur(10px)" },
      { x: 0, rotation: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power3.out" }, t);
    const leave = (p, t) => tl.fromTo(p,
      { x: 0, rotation: 0, filter: "blur(0px)" },
      { x: OFF, rotation: 5, filter: "blur(10px)", duration: 0.32, ease: "power3.in", immediateRender: false }, t);

    tl.fromTo("#fl-glow", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
    enter("#fl-p0", 0);
    // Name typed letter by letter (real app frames).
    [[1, 0.6], [2, 0.85], [3, 1.1]].forEach(([k, t]) => {
      tl.set("#fl-n" + (k - 1), { opacity: 0 }, t);
      tl.set("#fl-n" + k, { opacity: 1 }, t);
    });

    leave("#fl-p0", 2.72);
    enter("#fl-p1", 2.84);
    // Slider from week 3 to 20, decelerating.
    for (let w = 4; w <= 20; w++) {
      const k = (w - 3) / 17;
      const t = 3.45 + 1.15 * (1 - Math.sqrt(1 - k));
      tl.set("#fl-w" + (w - 1), { opacity: 0 }, t);
      tl.set("#fl-w" + w, { opacity: 1 }, t);
    }

    leave("#fl-p1", 6.52);
    enter("#fl-p2", 6.64);
    // Scroll down to the size card, like a thumb would.
    tl.fromTo("#fl-home", { y: 0 }, { y: -357, duration: 0.5, ease: "power2.inOut" }, 8.35);

    leave("#fl-p2", 10.12);
    enter("#fl-p3", 10.24);
    tl.fromTo("#fl-p3", { scale: 1, filter: "blur(0px)" }, { scale: 0.86, opacity: 0, filter: "blur(12px)", duration: 0.28, ease: "power3.in", immediateRender: false }, 12.9);
    tl.fromTo("#fl-glow", { opacity: 1 }, { opacity: 0, duration: 0.28, ease: "power2.in", immediateRender: false }, 12.9);

    // Headlines: quick blur in, hold, quick blur out.
    const heads = [[0, 3], [3, 4.9], [4.9, 6.8], [6.8, 8.6], [8.6, 10.4], [10.4, 13.2]];
    heads.forEach(([s, e], i) => {
      const h = "#fl-h" + i;
      tl.fromTo(h + " > div:first-child", { opacity: 0, scale: 0.7, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "back.out(1.8)" }, s + 0.04);
      tl.fromTo(h + " .fl-main", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, s + 0.1);
      const outAt = i === heads.length - 1 ? 12.88 : e - 0.13;
      tl.fromTo(h, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.12, ease: "power2.in" }, outAt);
    });
    window.__timelines["flow"] = tl;
  </script>
